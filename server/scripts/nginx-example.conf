# ==============================================================================
# Mitmachim Draft Sync — תבנית Nginx reverse proxy לשרת ה-API
# ------------------------------------------------------------------------------
# מה הקובץ הזה עושה:
#   חוסם HTTP (port 80) שמעביר (reverse proxy) את כל הבקשות לשרת ה-API
#   שרץ מקומית על http://127.0.0.1:3001 (ברירת המחדל של HOST/PORT ב-server/.env).
#
# הוראות שימוש:
#   1. החליפו את server_name למטה בדומיין האמיתי שלכם
#      (כאן זה placeholder: drafts-api.example.com).
#   2. העתיקו את הקובץ אל אתרי Nginx והפעילו אותו:
#         sudo cp server/scripts/nginx-example.conf /etc/nginx/sites-available/draftsync
#         sudo nano /etc/nginx/sites-available/draftsync   # ערכו את server_name
#         sudo ln -sf /etc/nginx/sites-available/draftsync /etc/nginx/sites-enabled/draftsync
#         sudo nginx -t && sudo systemctl reload nginx
#   3. הנפיקו תעודת HTTPS עם certbot (החליפו את הדומיין):
#         sudo certbot --nginx -d drafts-api.example.com
#
# חשוב לגבי TLS / 443:
#   אין צורך לכתוב כאן ידנית את חוסם ה-HTTPS (port 443). certbot --nginx
#   יוסיף אוטומטית את חוסם ה-443 עם נתיבי התעודות (ssl_certificate וכו'),
#   ויוסיף הפניה (redirect) מ-HTTP ל-HTTPS לתוך הקובץ הזה. הוא גם יחדש את
#   התעודה לבד. לכן משאירים כאן רק את חוסם ה-80 ונותנים ל-certbot להשלים.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;

    # החליפו לדומיין שלכם:
    server_name drafts-api.example.com;

    # אופציונלי: מגבילים את גודל גוף הבקשה כך שיתאים למגבלת ה-API
    # (MAX_BODY_BYTES = 1572864 בתים ≈ 1.5MB). 2m נותן מרווח קטן מעל המגבלה
    # כדי ש-Nginx לא יחתוך בקשות תקינות לפני שהשרת יחזיר שגיאה ברורה.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # כותרות סטנדרטיות שמעבירות לשרת את פרטי הלקוח/החיבור המקוריים.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
